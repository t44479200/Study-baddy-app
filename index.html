
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Buddy - Study Planner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5ff;
      color: #202544;
    }

    header {
      background: #6257e8;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px #252b4d0c;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border: 1px solid #d9dcef;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 9px;
      background: #6257e8;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.88;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      text-align: center;
    }

    .stat {
      flex: 1;
      padding: 14px 5px;
      background: #f3f2ff;
      border-radius: 12px;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-bottom: 5px;
    }

    #taskList {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #eeeef5;
    }

    .task input {
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .task span {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .task.done span {
      text-decoration: line-through;
      color: #888;
    }

    .delete {
      background: #ffe9ed;
      color: #c62848;
      padding: 8px 11px;
    }

    #emptyMessage {
      color: #777;
      text-align: center;
      padding: 15px 0;
    }

    .progress-track {
      height: 10px;
      background: #e8e8f5;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: #6257e8;
      transition: width 0.25s;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 420px) {
      form {
        flex-direction: column;
      }

      form button {
        width: 100%;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>📚 Study Buddy</h1>
    <p>Your daily study planner</p>
  </header>

  <main>
    <section class="card">
      <h2>Today's Progress</h2>

      <div class="stats">
        <div class="stat">
          <strong id="totalTasks">0</strong>
          Total Tasks
        </div>

        <div class="stat">
          <strong id="completedTasks">0</strong>
          Completed
        </div>

        <div class="stat">
          <strong id="remainingTasks">0</strong>
          Remaining
        </div>
      </div>

      <div class="progress-track">
        <div id="progressBar"></div>
      </div>

      <p id="progressText">0% completed</p>
    </section>

    <section class="card">
      <h2>➕ Add a Study Task</h2>

      <form id="taskForm">
        <input
          id="taskInput"
          type="text"
          placeholder="e.g. Complete math homework"
          maxlength="150"
          required
          aria-label="New study task"
        >

        <button type="submit">Add Task</button>
      </form>
    </section>

    <section class="card">
      <h2>📝 My Tasks</h2>

      <ul id="taskList"></ul>

      <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </section>
  </main>

  <footer>
    Study Buddy · Small steps, big progress!
  </footer>

  <script>
    const form = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const emptyMessage = document.getElementById("emptyMessage");

    const totalTasks = document.getElementById("totalTasks");
    const completedTasks = document.getElementById("completedTasks");
    const remainingTasks = document.getElementById("remainingTasks");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");

    let tasks = [];

    // Load saved tasks safely.
    try {
      const savedTasks = JSON.parse(
        localStorage.getItem("studyBuddyTasks") || "[]"
      );

      if (
        Array.isArray(savedTasks) &&
        savedTasks.every(task =>
          task &&
          typeof task.text === "string" &&
          typeof task.done === "boolean" &&
          typeof task.id === "number"
        )
      ) {
        tasks = savedTasks;
      }
    } catch (error) {
      tasks = [];
    }

    function saveTasks() {
      try {
        localStorage.setItem(
          "studyBuddyTasks",
          JSON.stringify(tasks)
        );
      } catch (error) {
        alert("Tasks could not be saved in this browser.");
      }
    }

    function updateProgress() {
      const total = tasks.length;
      const completed = tasks.filter(task => task.done).length;
      const remaining = total - completed;

      const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      totalTasks.textContent = total;
      completedTasks.textContent = completed;
      remainingTasks.textContent = remaining;
      progressBar.style.width = percentage + "%";
      progressText.textContent = percentage + "% completed";

      emptyMessage.hidden = total > 0;
    }

    function renderTasks() {
      taskList.replaceChildren();

      tasks.forEach(task => {
        const li = document.createElement("li");
        li.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute(
          "aria-label",
          "Mark " + task.text + " as completed"
        );

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute(
          "aria-label",
          "Delete " + task.text
        );

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        li.append(checkbox, text, deleteButton);
        taskList.appendChild(li);
      });

      updateProgress();
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const text = taskInput.value.trim();

      if (!text) {
        taskInput.focus();
        return;
      }

      tasks.push({
        id: Date.now() + Math.random(),
        text: text,
        done: false
      });

      saveTasks();
      renderTasks();

      form.reset();
      taskInput.focus();
    });

    renderTasks();
  </script>
</body>
</html>
